name: FocusProto
options:
  bundleIdPrefix: com.focusproto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  FocusProto:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusproto.app
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FOCUS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: FocusWidget
        embed: true
  FocusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusproto.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FOCUS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  FocusProto:
    build:
      targets:
        FocusProto: all
        FocusWidget: all
