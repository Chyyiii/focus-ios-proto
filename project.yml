name: FocusProto
options:
  bundleIdPrefix: com.focusproto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # B1: сборка только для симулятора, без подписи, без секретов
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  FocusProto:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Bridge
      - path: Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusproto.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/FocusProto.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FOCUS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.focusproto.app
            CFBundleURLSchemes:
              - focus-app
    dependencies:
      - target: FocusWidget
        embed: true
  FocusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusproto.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: Config/FocusWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FOCUS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FocusProtoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
      - path: Bridge
      - path: Web/FocusSnapshotSender.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusproto.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  FocusProto:
    build:
      targets:
        FocusProto: all
        FocusWidget: all
    test:
      targets:
        - FocusProtoTests
