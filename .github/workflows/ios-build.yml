name: iOS build (simulator, unsigned)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Environment info
        run: |
          mkdir -p build
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            swift --version
          } 2>&1 | tee build/environment.log

      - name: Check embedded web copy (SHA matches web-manifest)
        run: |
          python3 scripts/web_patch.py --check Web/index.html 2>&1 | tee build/web-check.log
          grep -c '"baseSha256": "cb4262abefc087eb901d98573ef2c7f1c8addad8270b7f792d92e85e023c9105"' Web/web-manifest.json
          node --check Web/FocusSnapshotSender.js && echo "sender js syntax OK" | tee -a build/web-check.log

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen 2>&1 | tee build/xcodegen-install.log

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee build/xcodegen.log

      - name: Build app + widget (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project FocusProto.xcodeproj \
            -scheme FocusProto \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Verify build output
        run: |
          chmod +x scripts/verify_build.sh
          scripts/verify_build.sh build/DerivedData 2>&1 | tee build/verify.log

      - name: Pick iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available 2>&1 | tee build/simulators.log
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and x.get('isAvailable', True)]; print(c[0]['udid'])")
          echo "Selected simulator: $UDID" | tee -a build/simulators.log
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project FocusProto.xcodeproj \
            -scheme FocusProto \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedDataTests \
            -resultBundlePath build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodetest.log

      - name: Verify tests actually ran
        run: |
          grep -E "Executed [1-9][0-9]* tests?, with 0 failures" build/xcodetest.log | tail -n 1 > build/tests-summary.log || true
          cat build/tests-summary.log
          test -s build/tests-summary.log

      - name: E2E (unsigned simulator build, informational)
        id: e2e_unsigned
        continue-on-error: true
        run: scripts/e2e_sim.sh "${{ steps.sim.outputs.udid }}" build/DerivedData/Build/Products/Debug-iphonesimulator/FocusProto.app unsigned 2>&1 | tee build/e2e-unsigned.log

      - name: Build with ad-hoc signing (simulator)
        id: adhoc_build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project FocusProto.xcodeproj -scheme FocusProto -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedDataAdhoc \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- build 2>&1 | tee build/xcodebuild-adhoc.log

      - name: E2E (ad-hoc signed simulator build, informational)
        id: e2e_adhoc
        continue-on-error: true
        if: steps.adhoc_build.outcome == 'success'
        run: scripts/e2e_sim.sh "${{ steps.sim.outputs.udid }}" build/DerivedDataAdhoc/Build/Products/Debug-iphonesimulator/FocusProto.app adhoc 2>&1 | tee build/e2e-adhoc.log

      - name: Package simulator app
        if: success()
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/FocusProto.app build/FocusProto-simulator.app.zip

      - name: Summary
        if: always()
        run: |
          {
            echo "## iOS build + tests summary"
            echo
            echo "- build warnings: $(grep -c 'warning:' build/xcodebuild.log 2>/dev/null || true)"
            echo "- build errors: $(grep -c 'error:' build/xcodebuild.log 2>/dev/null || true)"
            echo "- tests: $(cat build/tests-summary.log 2>/dev/null || echo 'did not run / failed')"
            echo "- web copy check: $(tail -n 1 build/web-check.log 2>/dev/null)"
            echo "- e2e unsigned (App Group → snapshot): ${{ steps.e2e_unsigned.outcome }}"
            echo "- e2e ad-hoc signed: ${{ steps.e2e_adhoc.outcome }}"
            echo
            echo '```'
            tail -n 15 build/verify.log 2>/dev/null || echo "verify step did not run"
            echo '```'
            echo
            echo "### Failed tests (if any)"
            echo '```'
            grep -E "error:|failed" build/xcodetest.log 2>/dev/null | head -n 40 || true
            echo '```'
            echo
            echo "### Build warnings and errors (first 40 lines)"
            echo '```'
            grep -E 'warning:|error:' build/xcodebuild.log 2>/dev/null | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/*.log
            build/e2e-unsigned/
            build/e2e-adhoc/
            build/result.xcresult
            build/tests.xcresult
            build/FocusProto-simulator.app.zip
